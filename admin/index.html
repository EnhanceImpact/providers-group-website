<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | The Providers Group</title><link rel="stylesheet" href="../style.css"><style>
.admin-shell{max-width:1200px;margin:auto;padding:32px 22px}.admin-top{display:flex;justify-content:space-between;gap:16px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.metric{background:#fff;border:1px solid #dbe5ee;border-radius:16px;padding:20px}.metric strong{font-size:2rem;display:block;color:var(--brand-blue,#458fce)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #cbd9e5;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tabs button.active{background:var(--brand-blue,#458fce);color:#fff}.tablewrap{overflow:auto;background:#fff;border:1px solid #dbe5ee;border-radius:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf2f6;white-space:nowrap}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}.login{max-width:440px;margin:80px auto}.login input{width:100%;padding:12px;margin:6px 0 14px}.error{color:#9b1c31}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}}
.blog-admin-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:20px 0}.admin-editor{background:#fff;border:1px solid #dbe5ee;border-radius:16px;padding:22px;margin:18px 0}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor-grid label{font-weight:700}.editor-grid input,.editor-grid select,.editor-grid textarea{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #b9cbd9;border-radius:8px;font:inherit}.editor-grid .wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:16px}@media(max-width:700px){.editor-grid{grid-template-columns:1fr}.editor-grid .wide{grid-column:auto}.blog-admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="admin-shell login"><img src="../assets/providers-group-logo.png" alt="The Providers Group" width="90"><span class="eyebrow">Admin</span><h1>Sign in</h1><p>Authorized Providers Group staff only.</p><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p id="login-status" class="error"></p></form></div>
<div id="dashboard" class="admin-shell" hidden><div class="admin-top"><div><span class="eyebrow">The Providers Group</span><h1>Website Dashboard</h1></div><button class="btn outline" id="signout">Sign out</button></div>
<div class="metrics"><div class="metric"><span>Contacts</span><strong id="m-contacts">—</strong></div><div class="metric"><span>New inquiries</span><strong id="m-inquiries">—</strong></div><div class="metric"><span>Program requests</span><strong id="m-programs">—</strong></div><div class="metric"><span>Tracker requests</span><strong id="m-downloads">—</strong></div></div>
<div class="tabs"><button data-view="contacts" class="active">Contacts</button><button data-view="inquiries">Inquiries</button><button data-view="program_requests">Program Requests</button><button data-view="resource_downloads">Resource Downloads</button><button data-view="blog_articles">Blog Articles</button></div><div id="admin-status"></div><div id="blog-tools" hidden><div class="blog-admin-head"><div><strong>60-week article bank</strong><p>Use rotation positions 1–60. Approved articles are public; drafts are not.</p></div><button class="btn" id="new-article" type="button">New article</button></div><form id="article-editor" class="admin-editor" hidden><input type="hidden" name="id"><div class="editor-grid"><label>Rotation #<input name="rotation_order" type="number" min="1" max="60" required></label><label>Status<select name="status"><option value="draft">Draft</option><option value="approved">Approved</option><option value="archived">Archived</option></select></label><label class="wide">Title<input name="title" required></label><label class="wide">Slug<input name="slug" required></label><label>Category<input name="category"></label><label>Author<input name="author" value="The Providers Group"></label><label class="wide">Featured image URL<input name="featured_image_url" type="url"></label><label class="wide">Excerpt<textarea name="excerpt" rows="3"></textarea></label><label class="wide">Article content<textarea name="content" rows="14" required></textarea></label><label>Original publish date<input name="original_publish_date" type="date"></label></div><div class="actions"><button class="btn" type="submit">Save article</button><button class="btn outline" id="cancel-edit" type="button">Cancel</button></div><p id="editor-status" class="status"></p></form></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="admin.js"></script></body></html>
